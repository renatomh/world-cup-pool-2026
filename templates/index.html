{% extends "base.html" %}

{% block content %}
<section class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
    <h1 class="text-2xl font-bold text-slate-900">{{ request.state._("World Cup Pool 2026") }}</h1>
    <p class="mt-3 text-slate-600">
        {{ request.state._("Welcome to the betting pool for the 2026 FIFA World Cup.") }}
    </p>

    <div class="mt-6 flex flex-col gap-3 sm:flex-row">
        <a
            href="/api/v1/health"
            class="inline-flex min-h-11 items-center justify-center rounded-lg bg-blue-600 px-4 text-sm font-semibold text-white hover:bg-blue-700 active:bg-blue-800"
        >
            {{ request.state._("API") }} — {{ request.state._("Health") }}
        </a>
    </div>
</section>
{% endblock %}
