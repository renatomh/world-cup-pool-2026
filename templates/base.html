<!DOCTYPE html>
<html lang="{{ request.state.locale }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
    <header class="border-b border-slate-200 bg-white">
        <div class="mx-auto flex max-w-3xl items-center justify-between px-4 py-4">
            <a href="/" class="text-lg font-bold text-blue-700">{{ app_name }}</a>
            <nav class="flex items-center gap-3 text-sm font-medium">
                <a href="/" class="min-h-11 min-w-11 inline-flex items-center justify-center px-2 text-slate-700 hover:text-blue-700">
                    {{ request.state._("Matches") }}
                </a>
                <a href="#" class="min-h-11 min-w-11 inline-flex items-center justify-center px-2 text-slate-400">
                    {{ request.state._("Leaderboard") }}
                </a>
                <div class="flex gap-1">
                    {% for locale in locales %}
                    <a
                        href="?lang={{ locale }}"
                        class="min-h-11 min-w-11 inline-flex items-center justify-center rounded-md px-2 text-xs font-semibold uppercase {% if request.state.locale == locale %}bg-blue-100 text-blue-800{% else %}text-slate-500 hover:bg-slate-100{% endif %}"
                    >
                        {{ locale }}
                    </a>
                    {% endfor %}
                </div>
            </nav>
        </div>
    </header>

    <main class="mx-auto max-w-3xl px-4 py-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
