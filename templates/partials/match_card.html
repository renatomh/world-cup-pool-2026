<article class="wc-card rounded-2xl p-4 sm:p-6">
    <p class="text-center text-xs font-semibold uppercase tracking-wide text-wc-gold">
        {{ match.kickoff_time | format_datetime }}
    </p>
    <div class="mt-4 flex items-center justify-between gap-2 sm:gap-4">
        <div class="flex w-[42%] items-center justify-end gap-2 sm:gap-3">
            <span class="truncate text-right text-sm font-bold sm:text-base">{{ match.home_team.name }}</span>
            <img src="{{ match.home_team.code | team_logo_url }}"
                 alt=""
                 width="40"
                 height="30"
                 class="h-8 w-10 shrink-0 rounded object-cover shadow-sm ring-1 ring-white/10"
                 loading="lazy">
        </div>
        <span class="shrink-0 font-display text-lg font-bold text-wc-muted">vs</span>
        <div class="flex w-[42%] items-center gap-2 sm:gap-3">
            <img src="{{ match.away_team.code | team_logo_url }}"
                 alt=""
                 width="40"
                 height="30"
                 class="h-8 w-10 shrink-0 rounded object-cover shadow-sm ring-1 ring-white/10"
                 loading="lazy">
            <span class="truncate text-left text-sm font-bold sm:text-base">{{ match.away_team.name }}</span>
        </div>
    </div>
    {% if match.group_name %}
    <p class="mt-3 text-center text-xs text-wc-muted">
        {{ request.state._("Group") }} {{ match.group_name }}
    </p>
    {% endif %}
</article>
